# ArgoCD Application: tells ArgoCD "keep the cluster in sync with this Git path"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: helm-guestbook
    helm:
      parameters:
        - name: replicaCount
          value: "3"
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true      # delete cluster resources that were removed from Git
      selfHeal: true   # revert manual changes made directly in the cluster
    syncOptions:
      - CreateNamespace=true
